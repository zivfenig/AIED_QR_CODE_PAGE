<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Hiele Paper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1C2F45;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.8rem 2.4rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      background: #E87722;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      margin-bottom: 1.4rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #2E4A6B;
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #6B7A8D;
      font-style: italic;
      margin-bottom: 1.0rem;
    }
    .authors {
      font-size: 0.8rem;
      color: #6B7A8D;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .authors strong { color: #2E4A6B; font-weight: 600; }
    .divider {
      width: 3rem;
      height: 3px;
      background: #E87722;
      border-radius: 2px;
      margin: 0 auto 2rem;
    }
    .buttons { display: flex; flex-direction: column; gap: 0.85rem; }
    .btn {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.15s;
      color: #fff;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-paper  { background: #E87722; }
    .btn-github { background: #2E4A6B; }
    .btn-lab    { background: #2A9D8F; }
    .btn-label { flex: 1; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">AIED 2026 · Main Track</div>
    <h1>Automatically Inferring Teachers' Geometric Content Knowledge</h1>
    <p class="subtitle">A Skills-Based Approach</p>
    <div class="divider"></div>
    <p class="authors">
      <strong>Ziv Fenigstein</strong>, Kobi Gal, Avi Segal,<br>
      Osama Swidan, Inbal Israel, Hassan Ayoob<br>
      Ben-Gurion University of the Negev
    </p>

    <div class="buttons">

      <!-- ══ REPLACE: put your arXiv link below ══ -->
      <a href="PUT_ARXIV_LINK_HERE" target="_blank" class="btn btn-paper">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span class="btn-label">Read the Paper</span>
        <span>→</span>
      </a>

      <!-- ══ REPLACE: put your GitHub repo link below ══ -->
      <a href="PUT_GITHUB_REPO_LINK_HERE" target="_blank" class="btn btn-github">
        <svg viewBox="0 0 24 24" fill="white">

        </svg>
        <span class="btn-label">Code &amp; Data — GitHub</span>
        <span>→</span>
      </a>

      <!-- ══ REPLACE: put your lab website link below ══ -->
      <a href="PUT_LAB_WEBSITE_LINK_HERE" target="_blank" class="btn btn-lab">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="btn-label">AI &amp; Data Science Lab — BGU</span>
        <span>→</span>
      </a>

    </div>
  </div>
</body>
</html>
